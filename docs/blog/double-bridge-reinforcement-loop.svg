<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Mood-Appraisal Reinforcement Loop</text>

  <!-- BEFORE section -->
  <rect x="20" y="48" width="370" height="450" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="205" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">BEFORE: Double Bridge</text>

  <!-- Before boxes -->
  <rect x="110" y="92" width="190" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="205" y="114" text-anchor="middle" font-size="11" fill="#334155">Mood State (t)</text>

  <rect x="110" y="162" width="190" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="205" y="184" text-anchor="middle" font-size="11" fill="#334155">LLM Appraisal</text>

  <rect x="110" y="232" width="190" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="205" y="254" text-anchor="middle" font-size="11" fill="#334155">EmotionMapper</text>

  <!-- Two bridge boxes side by side -->
  <rect x="42" y="308" width="150" height="48" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="117" y="328" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Bridge 1</text>
  <text x="117" y="342" text-anchor="middle" font-size="9" fill="#991b1b">AppraisalTickParticipant</text>

  <rect x="218" y="308" width="150" height="48" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="293" y="328" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Bridge 2</text>
  <text x="293" y="342" text-anchor="middle" font-size="9" fill="#991b1b">CognitionCore</text>

  <rect x="110" y="392" width="190" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="205" y="412" text-anchor="middle" font-size="11" fill="#334155">Mood State (t+1)</text>

  <!-- Before arrows -->
  <line x1="205" y1="128" x2="205" y2="158" stroke="#475569" marker-end="url(#arrow)"/>
  <text x="290" y="149" font-size="9" fill="#64748b">raw PAD numbers</text>

  <line x1="205" y1="198" x2="205" y2="228" stroke="#475569" marker-end="url(#arrow)"/>

  <line x1="155" y1="268" x2="117" y2="304" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <line x1="255" y1="268" x2="293" y2="304" stroke="#dc2626" marker-end="url(#arrow-red)"/>

  <line x1="117" y1="356" x2="170" y2="388" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <line x1="293" y1="356" x2="240" y2="388" stroke="#dc2626" marker-end="url(#arrow-red)"/>

  <!-- Feedback loop arrow (before) -->
  <path d="M110,410 Q40,410 40,250 Q40,92 106,110" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>
  <text x="32" y="260" font-size="9" fill="#dc2626" transform="rotate(-90 32 260)">2x shift feeds back</text>

  <!-- Label -->
  <text x="205" y="468" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Mood shifts 2x per tick</text>
  <text x="205" y="484" text-anchor="middle" font-size="10" fill="#991b1b">Negative attractor lock</text>

  <!-- AFTER section -->
  <rect x="410" y="48" width="370" height="450" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="595" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">AFTER: Single Bridge</text>

  <!-- After boxes -->
  <rect x="500" y="92" width="190" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="595" y="114" text-anchor="middle" font-size="11" fill="#334155">Mood State (t)</text>

  <rect x="500" y="162" width="190" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="595" y="178" text-anchor="middle" font-size="11" fill="#334155">LLM Appraisal</text>
  <text x="595" y="190" text-anchor="middle" font-size="9" fill="#16a34a" font-style="italic">"appraise the situation, not this mood"</text>

  <rect x="500" y="232" width="190" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="595" y="254" text-anchor="middle" font-size="11" fill="#334155">EmotionMapper</text>

  <!-- Single bridge box -->
  <rect x="520" y="308" width="150" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="595" y="328" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Single Bridge</text>
  <text x="595" y="342" text-anchor="middle" font-size="9" fill="#166534">CognitionCore only</text>

  <rect x="500" y="392" width="190" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="595" y="412" text-anchor="middle" font-size="11" fill="#334155">Mood State (t+1)</text>

  <!-- After arrows -->
  <line x1="595" y1="128" x2="595" y2="158" stroke="#475569" marker-end="url(#arrow)"/>
  <text x="680" y="149" font-size="9" fill="#16a34a">framed as background</text>

  <line x1="595" y1="198" x2="595" y2="228" stroke="#475569" marker-end="url(#arrow)"/>

  <line x1="595" y1="268" x2="595" y2="304" stroke="#16a34a" marker-end="url(#arrow-green)"/>

  <line x1="595" y1="356" x2="595" y2="388" stroke="#16a34a" marker-end="url(#arrow-green)"/>

  <!-- Feedback loop arrow (after) -->
  <path d="M500,410 Q430,410 430,250 Q430,92 496,110" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-green)"/>
  <text x="422" y="260" font-size="9" fill="#166534" transform="rotate(-90 422 260)">1x shift, proportional</text>

  <!-- Label -->
  <text x="595" y="468" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Mood shifts 1x per tick</text>
  <text x="595" y="484" text-anchor="middle" font-size="10" fill="#166534">Positive observations recover</text>
</svg>
