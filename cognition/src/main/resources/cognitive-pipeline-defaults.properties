# ─── Goal Lifecycle ────────────────────────────────────────────────
#
# Goal prioritization weights and decay thresholds.
# @see Locke & Latham (2002), American Psychologist.
# @see Wrosch et al. (2003), PSPB — adaptive disengagement.

# Priority composite weights (should sum to 1.0).
# Importance+urgency (0.6) dominate per Locke & Latham (2002); feasibility+affective (0.4) per Wigfield & Eccles (2000)
casehub.cognition.goals.urgency-weight=0.3
casehub.cognition.goals.feasibility-weight=0.2
casehub.cognition.goals.affective-weight=0.2
casehub.cognition.goals.importance-weight=0.3

# Confidence thresholds for goal decay transitions.
casehub.cognition.goals.dormant-confidence-threshold=0.4
casehub.cognition.goals.abandon-confidence-threshold=0.2

# Attention signal thresholds.
casehub.cognition.goals.urgency-spike-threshold=0.7
casehub.cognition.goals.priority-shift-threshold=0.2

# Legacy PAD affect — per-status defaults.
casehub.cognition.goals.active-pleasure=0.2
casehub.cognition.goals.active-urgency-arousal-factor=0.8
casehub.cognition.goals.active-dominance=0.3
casehub.cognition.goals.blocked-pleasure=-0.4
casehub.cognition.goals.blocked-urgency-pleasure-factor=0.4
casehub.cognition.goals.blocked-arousal=0.3
casehub.cognition.goals.blocked-urgency-arousal-factor=0.5
casehub.cognition.goals.blocked-dominance=-0.3
casehub.cognition.goals.completed-pleasure=0.6
casehub.cognition.goals.completed-arousal=0.2
casehub.cognition.goals.completed-dominance=0.5
casehub.cognition.goals.dormant-pleasure=0.0
casehub.cognition.goals.dormant-arousal=-0.3
casehub.cognition.goals.dormant-dominance=0.0
casehub.cognition.goals.abandoned-pleasure=-0.2
casehub.cognition.goals.abandoned-arousal=-0.2
