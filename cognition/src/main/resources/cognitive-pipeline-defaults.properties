# ─── Hygiene Adaptation (consolidation phase @Priority(48)) ────────
#
# Automatic retention threshold adaptation based on eviction pressure.
# Monitors lowRetentionCount/totalScored from KnowledgeGapSummary
# (aggregated per tenant) and nudges retentionThreshold to keep
# eviction pressure within a target band.
#
# Disabled by default; enable when memory hygiene is active and stable.
# casehub.cognition.hygiene-adaptation.enabled=false
#
# Target band for eviction pressure ratio.
# Above upper: threshold too aggressive → lower retentionThreshold.
# Below lower: threshold too lenient → raise retentionThreshold.
# casehub.cognition.hygiene-adaptation.eviction-pressure-upper-threshold=0.3
# casehub.cognition.hygiene-adaptation.eviction-pressure-lower-threshold=0.05
#
# Step size per consolidation tick (bounded, prevents large jumps).
# casehub.cognition.hygiene-adaptation.step-size=0.02
#
# Hard bounds for retention threshold (clamped after each step).
# casehub.cognition.hygiene-adaptation.min-retention-threshold=0.01
# casehub.cognition.hygiene-adaptation.max-retention-threshold=0.5

# ─── Edge Inference (consolidation) ────────────────────────────────
#
# Scans for under-connected nodes and infers edges from memory
# co-occurrence via LLM. One-off per entity pair — inferred edges
# are stored permanently.
#
# Default: disabled (opt-in via build property)
# casehub.mindmap.consolidation.edge-inference.enabled=false
#
# Nodes with this many edges or fewer are candidates for inference.
# casehub.mindmap.consolidation.edge-inference.degree-threshold=1
#
# Maximum candidate pairs to send to LLM per consolidation run.
# casehub.mindmap.consolidation.edge-inference.max-candidates=30
