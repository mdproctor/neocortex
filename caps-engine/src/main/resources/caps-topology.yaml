# CAPS Network Topology — Engine Configuration
# Source: casehubio/neocortex#407 research spec
# Extended for #408 graph engine: tags on connections, keywords on input
# nodes, distortion definitions.
#
# Format: nodes define the network vertices; connections define
# weighted edges; disposition_modifiers define how DispositionAxes
# scale connection weights per character; distortions define
# data-driven cognitive distortion mechanics.

version: 1
spec_issue: 407
parent_epic: 406

nodes:
  input:
    relationship:
      - id: secure_attachment
        keywords: [secure, warmth, reliable, responsive, consistent, caring, dependable, nurturing, safe]
      - id: inconsistent_care
        keywords: [inconsistent, unpredictable, sometimes, variable, unreliable, mixed]
      - id: rejection
        keywords: [rejected, dismissed, unwanted, turned away, refused, ignored]
      - id: betrayal
        keywords: [betrayed, deceived, lied, broken trust, unfaithful, backstabbed]
      - id: abandonment
        keywords: [abandoned, left, deserted, walked away, disappeared, alone]
      - id: neglect
        keywords: [neglected, ignored, forgotten, overlooked, unseen, invisible]
    threat:
      - id: physical_threat
        keywords: [threat, danger, violence, hit, attacked, hurt, harm, aggressive]
      - id: social_threat
        keywords: [humiliated, embarrassed, mocked, ridiculed, judged, shamed]
      - id: psychological_threat
        keywords: [manipulated, gaslighted, controlled, threatened, intimidated]
      - id: unpredictable_danger
        keywords: [unpredictable, chaotic, volatile, unstable, explosive]
    achievement:
      - id: mastery
        keywords: [mastered, accomplished, succeeded, achieved, learned, skilled]
      - id: failure
        keywords: [failed, couldn't, unable, mistake, wrong, incompetent]
      - id: performance_judged
        keywords: [evaluated, judged, tested, graded, assessed, scrutinized, criticized]
      - id: competence_recognition
        keywords: [praised, recognized, acknowledged, appreciated, competent, capable]
    social:
      - id: acceptance
        keywords: [accepted, welcomed, included, belonged, valued, appreciated]
      - id: exclusion
        keywords: [excluded, left out, rejected, ostracized, isolated, marginalized]
      - id: dominance
        keywords: [dominated, controlled, overpowered, subordinated, bullied]
      - id: submission
        keywords: [submitted, yielded, gave in, complied, surrendered, obeyed]
      - id: modeling_observed
        keywords: [watched, observed, saw, witnessed, modeled, imitated, learned from]
    resource:
      - id: scarcity
        keywords: [scarce, lacking, insufficient, poverty, deprived, without, hungry]
      - id: abundance
        keywords: [abundant, plenty, enough, provided, surplus, wealthy]
      - id: competition
        keywords: [competed, rivaled, fought over, contested, competed for]
      - id: sharing
        keywords: [shared, gave, generous, cooperative, distributed, helped]
    autonomy:
      - id: agency_granted
        keywords: [freedom, choice, autonomy, independent, empowered, allowed]
      - id: controlled
        keywords: [controlled, restricted, confined, micromanaged, dictated, no choice]
      - id: choice_available
        keywords: [options, alternatives, choose, decide, free to]
      - id: powerlessness
        keywords: [powerless, helpless, trapped, stuck, no control, overwhelmed]
    consequence:
      - id: reward
        keywords: [rewarded, praised, gained, earned, got, received, bonus]
      - id: punishment
        keywords: [punished, disciplined, penalized, consequences, scolded, reprimanded]
      - id: reward_removal
        keywords: [taken away, lost, removed, deprived, withheld]
      - id: aversive_removal
        keywords: [relief, escaped, avoided, stopped, ended, free from]

  mediating:
    self_model:
      - name: self_worth
        type: bipolar
        range: [-1, 1]
        negative_pole: "worthless / helpless / incompetent"
        positive_pole: "worthy / competent / capable"
        source_models: [attachment, cbt, bandura]
      - name: self_efficacy
        type: bipolar
        range: [-1, 1]
        negative_pole: "incompetent / incapable"
        positive_pole: "capable / competent"
        source_models: [bandura, cbt]
    other_model:
      - name: other_reliability
        type: bipolar
        range: [-1, 1]
        negative_pole: "hostile / unreliable"
        positive_pole: "supportive / reliable"
        source_models: [attachment, cbt]
      - name: other_safety
        type: bipolar
        range: [-1, 1]
        negative_pole: "dangerous / judgmental"
        positive_pole: "safe / accepting"
        source_models: [attachment, cbt]
    world_model:
      - name: world_predictability
        type: bipolar
        range: [-1, 1]
        negative_pole: "dangerous / unfair"
        positive_pole: "safe / fair"
        source_models: [cbt]
      - name: future_outlook
        type: bipolar
        range: [-1, 1]
        negative_pole: "hopeless"
        positive_pole: "hopeful"
        source_models: [cbt]
    affect_systems:
      - name: BAS_activation
        type: unipolar
        range: [0, 1]
        source_models: [bis_bas, operant]
      - name: BIS_activation
        type: unipolar
        range: [0, 1]
        source_models: [bis_bas]
      - name: FFFS_activation
        type: unipolar
        range: [0, 1]
        source_models: [bis_bas, trauma]
      - name: arousal_level
        type: unipolar
        range: [0, 1]
        source_models: [bis_bas, trauma, attachment]
    threat_processing:
      - name: threat_sensitivity
        type: unipolar
        range: [0, 1]
        source_models: [trauma, bis_bas]
      - name: autonomic_activation
        type: unipolar
        range: [0, 1]
        source_models: [trauma]
      - name: escape_assessment
        type: unipolar
        range: [0, 1]
        source_models: [trauma, bis_bas]
    response_outcome:
      - name: reinforcement_expectation
        type: bipolar
        range: [-1, 1]
        negative_pole: "punishment expected"
        positive_pole: "reward expected"
        source_models: [operant, cbt, bandura]
      - name: punishment_expectation
        type: unipolar
        range: [0, 1]
        source_models: [operant]
    social_cognition:
      - name: model_attention
        type: unipolar
        range: [0, 1]
        source_models: [bandura]
      - name: behavior_schema
        type: unipolar
        range: [0, 1]
        source_models: [bandura]
      - name: behavior_attempt
        type: unipolar
        range: [0, 1]
        source_models: [bandura]
      - name: behavior_persistence
        type: unipolar
        range: [0, 1]
        source_models: [bandura]
      - name: vicarious_learning
        type: unipolar
        range: [0, 1]
        source_models: [bandura]
      - name: social_comparison
        type: unipolar
        range: [0, 1]
        source_models: [bandura]

  output:
    approach_avoidance:
      - approach
      - withdraw
      - cautious_approach
    social:
      - trust
      - distrust
      - proximity_seek
      - distance_maintain
    conflict:
      - fight
      - flight
      - freeze
      - fawn
      - assert
      - submit
    achievement:
      - persist
      - abandon
      - perfectionism
      - risk_take
    autonomy:
      - comply
      - rebel
      - self_direct
      - depend
    learning:
      - explore
      - consolidate
      - generalize
      - discriminate

# Key connections with initial weights and provenance.
# Format: source -> target, weight, provenance (empirical/consensus/estimated)
# tags: connection group labels for disposition modulation resolution
connections:
  # Attachment chains
  - from: secure_attachment
    to: self_worth
    weight: 0.30
    provenance: empirical
    source: "van IJzendoorn 1995, r=.24-.32"
    tags: [social_input]
  - from: inconsistent_care
    to: other_reliability
    weight: -0.30
    provenance: empirical
    source: "van IJzendoorn 1995"
    tags: []
  - from: inconsistent_care
    to: proximity_seek
    weight: 0.40
    provenance: consensus
    source: "anxious attachment pattern"
    tags: []
  - from: rejection
    to: other_reliability
    weight: -0.35
    provenance: consensus
    source: "avoidant attachment formation"
    tags: []
  - from: rejection
    to: distance_maintain
    weight: 0.35
    provenance: consensus
    source: "avoidant attachment pattern"
    tags: []
  - from: self_worth
    to: trust
    weight: 0.40
    provenance: empirical
    source: "Zhang et al. 2022, r=.42 anxiety→mental health"
    tags: []
  - from: other_reliability
    to: trust
    weight: 0.45
    provenance: empirical
    source: "Zhang et al. 2022, r=.28 avoidance→mental health"
    tags: []

  # Disposition-activated: social/achievement → self_worth
  - from: acceptance
    to: self_worth
    weight: 0.25
    provenance: consensus
    source: "social acceptance → self-worth (cooperative disposition boost)"
    tags: [social_input]
  - from: mastery
    to: self_worth
    weight: 0.25
    provenance: consensus
    source: "competence mastery → self-worth (independent disposition boost)"
    tags: []
  - from: performance_judged
    to: self_worth
    weight: 0.20
    provenance: consensus
    source: "performance evaluation → self-worth (competitive disposition boost)"
    tags: []
  - from: mastery
    to: self_efficacy
    weight: 0.30
    provenance: empirical
    source: "mastery experience → self-efficacy (Bandura 1997)"
    tags: []

  # BIS/BAS chains
  - from: reward
    to: BAS_activation
    weight: 0.50
    provenance: consensus
    source: "Gray RST dopaminergic RPE"
    tags: [bas]
  - from: punishment
    to: BIS_activation
    weight: 0.35
    provenance: consensus
    source: "punishment → behavioral inhibition (guilt, self-restraint)"
    tags: [bis]
  - from: punishment
    to: FFFS_activation
    weight: 0.50
    provenance: consensus
    source: "Gray RST aversive system"
    tags: [threat]
  - from: BAS_activation
    to: approach
    weight: 0.60
    provenance: empirical
    source: "Carver & White BAS scales"
    tags: [bas]
  - from: BIS_activation
    to: cautious_approach
    weight: 0.55
    provenance: empirical
    source: "BIS→anxiety g=1.21 meta-analysis"
    tags: [bis]
  - from: BIS_activation
    to: withdraw
    weight: 0.40
    provenance: empirical
    source: "BIS→depression g=0.99"
    tags: [bis]
  - from: FFFS_activation
    to: fight
    weight: 0.35
    provenance: consensus
    source: "defensive distance: proximate threat"
    tags: [threat, fight_assert]
  - from: FFFS_activation
    to: flight
    weight: 0.40
    provenance: consensus
    source: "defensive distance: intermediate"
    tags: [threat, flight_freeze_withdraw]
  - from: FFFS_activation
    to: freeze
    weight: 0.30
    provenance: consensus
    source: "defensive distance: distant/uncertain"
    tags: [threat, flight_freeze_withdraw]
  - from: escape_assessment
    to: flight
    weight: 0.35
    provenance: consensus
    source: "escapability modulates FFFS response"
    tags: [flight_freeze_withdraw]
  - from: escape_assessment
    to: freeze
    weight: -0.30
    provenance: consensus
    source: "inescapable → freeze over flight"
    tags: [flight_freeze_withdraw]

  # CBT chains
  - from: self_worth
    to: withdraw
    weight: -0.35
    provenance: empirical
    source: "CBT vs controls g=0.51"
    tags: []
  - from: future_outlook
    to: persist
    weight: 0.40
    provenance: consensus
    source: "hopelessness → behavioral withdrawal"
    tags: []
  - from: world_predictability
    to: threat_sensitivity
    weight: -0.30
    provenance: consensus
    source: "dangerous world → heightened threat detection"
    tags: [threat]

  # Trauma chains
  - from: physical_threat
    to: threat_sensitivity
    weight: 0.50
    provenance: empirical
    source: "ACE 4+ OR=4.6 depressed mood"
    tags: [threat]
  - from: physical_threat
    to: FFFS_activation
    weight: 0.55
    provenance: empirical
    source: "ACE 4+ OR=12.2 suicide attempt"
    tags: [threat]
  - from: threat_sensitivity
    to: arousal_level
    weight: 0.50
    provenance: consensus
    source: "kindling model: sensitization"
    tags: [threat]
  - from: powerlessness
    to: freeze
    weight: 0.40
    provenance: consensus
    source: "Walker 4F: inescapable threat"
    tags: [compliance, flight_freeze_withdraw]
  - from: powerlessness
    to: fawn
    weight: 0.35
    provenance: consensus
    source: "Walker 4F: threat from attachment figure"
    tags: [compliance, fawn_accommodate]

  # Operant chains (weight update — these define the learning signal)
  - from: reward
    to: reinforcement_expectation
    weight: 0.50
    provenance: empirical
    source: "Rescorla-Wagner, beta=0.1-0.5"
    tags: [bas]
  - from: punishment
    to: punishment_expectation
    weight: 0.50
    provenance: empirical
    source: "Rescorla-Wagner"
    tags: []
  - from: reinforcement_expectation
    to: approach
    weight: 0.45
    provenance: consensus
    source: "positive reinforcement → approach"
    tags: [bas]
  - from: punishment_expectation
    to: withdraw
    weight: 0.40
    provenance: consensus
    source: "punishment → avoidance"
    tags: []

  # Bandura chains
  - from: modeling_observed
    to: model_attention
    weight: 0.40
    provenance: consensus
    source: "model salience factors"
    tags: []
  - from: model_attention
    to: behavior_schema
    weight: 0.35
    provenance: consensus
    source: "attention → retention"
    tags: [schema]
  - from: behavior_schema
    to: behavior_attempt
    weight: 0.30
    provenance: consensus
    source: "retention → reproduction, gated by self_efficacy"
    tags: [schema]
  - from: self_efficacy
    to: behavior_attempt
    weight: 0.50
    provenance: empirical
    source: "Multon et al. 1991, 14% variance"
    tags: []
  - from: behavior_attempt
    to: behavior_persistence
    weight: 0.35
    provenance: consensus
    source: "motivation from vicarious/direct reinforcement"
    tags: []

  # Autonomy chains
  - from: agency_granted
    to: self_efficacy
    weight: 0.35
    provenance: consensus
    source: "autonomy experience → self-efficacy (Deci & Ryan SDT)"
    tags: [self_direction]
  - from: choice_available
    to: BAS_activation
    weight: 0.25
    provenance: consensus
    source: "choice availability → approach motivation"
    tags: [self_direction]
  - from: controlled
    to: comply
    weight: 0.40
    provenance: consensus
    source: "external control → compliance behavior"
    tags: [compliance]
  - from: social_threat
    to: BIS_activation
    weight: 0.40
    provenance: consensus
    source: "social evaluation threat → behavioral inhibition (Dickerson & Kemeny 2004)"
    tags: [bis, threat]

  # Composition bridges
  - from: BIS_activation
    to: threat_sensitivity
    weight: 0.40
    provenance: empirical
    source: "childhood neglect→BIS rho=0.24, Tamada 2025"
    tags: [bis, threat]
  - from: self_worth
    to: self_efficacy
    weight: 0.35
    provenance: consensus
    source: "attachment IWM → self-efficacy (shared node bridge)"
    tags: []
  - from: arousal_level
    to: BIS_activation
    weight: 0.30
    provenance: consensus
    source: "window of tolerance: hyperarousal → BIS"
    tags: [bis, threat]
  - from: arousal_level
    to: FFFS_activation
    weight: 0.35
    provenance: consensus
    source: "window of tolerance: extreme arousal → FFFS"
    tags: [threat]

# Disposition modulation — how DispositionAxes scale connection weights
disposition_modifiers:
  socialOrient:
    independent:
      social_input_connections: 0.5
      mastery_to_self_worth: 1.3
    cooperative:
      acceptance_to_self_worth: 1.3
      other_reliability_to_trust: 1.2
    competitive:
      performance_judged_to_self_worth: 1.3
      BAS_activation_to_approach: 1.2

  ruleFollowing:
    flexible:
      punishment_to_FFFS_activation: 0.7
      schema_connections: 0.8
    moderate:
      _default: 1.0
    strict:
      social_threat_to_BIS_activation: 1.4
      punishment_to_BIS_activation: 1.3
      schema_connections: 1.3

  riskAppetite:
    conservative:
      BIS_connections: 1.3
      threat_sensitivity_threshold: 1.2
      BAS_connections: 0.7
    calculated:
      BIS_connections: 1.05
      BAS_connections: 0.95
    bold:
      BAS_connections: 1.3
      threat_sensitivity_threshold: 0.7
      BIS_connections: 0.7

  autonomy:
    low:
      compliance_connections: 1.3
      agency_granted: 0.6
    moderate:
      _default: 1.0
    high:
      self_direction_connections: 1.3
      controlled_to_comply: 0.6

  conflictMode:
    cooperative:
      fawn_accommodate_pathways: 1.3
    competitive:
      fight_assert_pathways: 1.3
    analytical:
      cautious_approach: 1.3
      BIS_activation_to_cautious_approach: 1.2
    avoidant:
      flight_freeze_withdraw_pathways: 1.3

# Cognitive distortions — data-driven definitions applied generically
# during CAPS settling. The engine reads these as data; it does not
# know about specific distortion types by name.
distortions:
  - id: all_or_nothing
    baseThreshold: 0.6
    multiplierMin: 1.5
    multiplierMax: 2.0
    effect: MULTIPLICATIVE
    negativeWeight: 1.0
    positiveWeight: 0.3
    targetCategories: [self_model, other_model, world_model]
  - id: overgeneralization
    baseThreshold: 0.5
    multiplierMin: 0.2
    multiplierMax: 0.4
    effect: ADDITIVE
    negativeWeight: 1.0
    positiveWeight: 0.3
    targetCategories: [self_model, other_model, world_model, response_outcome]
  - id: catastrophizing
    baseThreshold: 0.7
    multiplierMin: 1.5
    multiplierMax: 2.0
    effect: MULTIPLICATIVE
    negativeWeight: 1.0
    positiveWeight: 0.3
    targetCategories: [world_model, response_outcome, threat_processing]
  - id: mental_filtering
    baseThreshold: 0.4
    multiplierMin: 0.3
    multiplierMax: 0.5
    effect: MULTIPLICATIVE
    negativeWeight: 1.0
    positiveWeight: 0.3
    targetCategories: [self_model, other_model, world_model]
  - id: emotional_reasoning
    baseThreshold: 0.8
    multiplierMin: 0.3
    multiplierMax: 0.3
    effect: ADDITIVE
    negativeWeight: 1.0
    positiveWeight: 0.3
    targetCategories: [affect_systems, self_model]

# Weight update parameters (from §5)
weight_update:
  rescorla_wagner:
    alpha_range: [0.01, 0.25]
    beta_range: [0.1, 0.5]
    temporal_discount: 0.95
  schedule_modifiers:
    continuous: 1.0
    fixed_ratio: 1.5
    variable_ratio: 3.0
    fixed_interval: 1.2
    variable_interval: 2.0
  vicarious_discount: 0.20
  convergence:
    max_iterations: 100
    epsilon: 0.001
    activation_clamp: [-1, 1]
    effective_weight_cap: [-2.0, 2.0]
    compound_distortion_cap: [0.1, 3.0]
    saturation_warning_threshold: 0.60
