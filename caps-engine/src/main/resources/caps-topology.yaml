# CAPS Network Topology — Engine Configuration
# Source: casehubio/neocortex#407 research spec
# Extended for #408 graph engine: tags on connections, weighted vocabulary
# on input nodes (#115 Layer A), distortion definitions.
#
# Format: nodes define the network vertices; connections define
# weighted edges; disposition_modifiers define how DispositionAxes
# scale connection weights per character; distortions define
# data-driven cognitive distortion mechanics.

version: 1
spec_issue: 407
parent_epic: 406

nodes:
  # Vocabulary: construct-derived weighted terms (§10.5, §12.2)
  # Weights: strong 0.7-0.9, moderate 0.4-0.6, faint 0.2-0.3
  # Source constructs cited per category. Terms are universal across
  # characters — individual differences come from connection weights
  # and drive amplification, not different input features (Read & Miller 2002).
  input:
    # Source: Bowlby (1969/1982) attachment theory
    relationship:
      - id: secure_attachment
        description: "Being cared for, comforted, or protected by someone reliable and responsive"
        vocabulary:
          nurturing: 0.8
          warmth: 0.7
          caring: 0.7
          comforted: 0.7
          secure: 0.7
          trusted: 0.6
          reliable: 0.5
          responsive: 0.5
          dependable: 0.5
          safe: 0.5
          protected: 0.5
          consistent: 0.3
      - id: inconsistent_care
        description: "Receiving care that is unpredictable — sometimes present, sometimes absent"
        vocabulary:
          inconsistent: 0.8
          unpredictable: 0.7
          unreliable: 0.7
          erratic: 0.7
          variable: 0.5
          mixed: 0.4
          sometimes: 0.3
      - id: rejection
        description: "Being dismissed, refused, or turned away by someone whose acceptance matters"
        vocabulary:
          rejected: 0.9
          dismissed: 0.8
          unwanted: 0.8
          turned away: 0.7
          rebuffed: 0.7
          refused: 0.6
          spurned: 0.6
          ignored: 0.5
          cold: 0.3
      - id: betrayal
        description: "Trust violated — someone deceived, lied to, or broke faith with you"
        vocabulary:
          betrayed: 0.9
          backstabbed: 0.9
          broken trust: 0.8
          deceived: 0.7
          lied: 0.6
          unfaithful: 0.7
          double-crossed: 0.8
      - id: abandonment
        description: "Left behind or deserted by someone who was supposed to stay"
        vocabulary:
          abandoned: 0.9
          deserted: 0.8
          forsaken: 0.8
          walked away: 0.6
          disappeared: 0.6
          left behind: 0.6
          left: 0.4
          alone: 0.3
      - id: neglect
        description: "Being unseen or overlooked — needs going unnoticed or unmet"
        vocabulary:
          neglected: 0.9
          unseen: 0.8
          invisible: 0.7
          unnoticed: 0.7
          ignored: 0.6
          forgotten: 0.6
          overlooked: 0.5

    # Source: Gray (1982) RST, Dickerson & Kemeny (2004), trauma research
    threat:
      - id: physical_threat
        description: "Bodily danger — attacked, chased, trapped, or physically harmed"
        vocabulary:
          attacked: 0.9
          violence: 0.9
          weapon: 0.8
          danger: 0.8
          hit: 0.7
          hurt: 0.6
          harm: 0.6
          threat: 0.6
          aggressive: 0.5
          chase: 0.5
          trapped: 0.5
          risk: 0.3
      - id: social_threat
        description: "Public humiliation, shaming, or being mocked in front of others"
        vocabulary:
          humiliated: 0.9
          shamed: 0.8
          mocked: 0.7
          ridiculed: 0.7
          embarrassed: 0.6
          laughed at: 0.7
          scorned: 0.7
          judged: 0.3
      - id: psychological_threat
        description: "Being manipulated, gaslighted, coerced, or intimidated"
        vocabulary:
          gaslighted: 0.9
          manipulated: 0.8
          intimidated: 0.7
          coerced: 0.7
          threatened: 0.6
          controlled: 0.5
      - id: unpredictable_danger
        description: "Chaotic or volatile environment where anything could happen without warning"
        vocabulary:
          chaotic: 0.8
          volatile: 0.8
          explosive: 0.8
          unpredictable: 0.6
          unstable: 0.5
          erratic: 0.5

    # Source: McClelland (1961) achievement motivation, Winter (1973) nPow
    achievement:
      - id: mastery
        description: "Demonstrating competence — solving, building, or accomplishing through skill"
        vocabulary:
          mastered: 0.9
          accomplished: 0.8
          excelled: 0.7
          succeeded: 0.6
          achieved: 0.6
          skilled: 0.5
          solved: 0.5
          learned: 0.3
      - id: failure
        description: "Falling short, making mistakes, being defeated or proven incompetent"
        vocabulary:
          failed: 0.9
          incompetent: 0.8
          defeated: 0.8
          collapsed: 0.7
          humiliated: 0.7
          bungled: 0.7
          mistake: 0.6
          stumbled: 0.5
          unable: 0.5
          wrong: 0.4
          fell short: 0.5
          couldn't: 0.3
          struggle: 0.3
          slip: 0.3
      - id: performance_judged
        description: "Being evaluated, tested, or scrutinized for competence"
        vocabulary:
          scrutinized: 0.8
          criticized: 0.7
          evaluated: 0.6
          assessed: 0.5
          tested: 0.5
          graded: 0.5
          judged: 0.4
          examined: 0.4
      - id: competence_recognition
        description: "Being praised, acknowledged, or recognized for ability"
        vocabulary:
          brilliant: 0.8
          masterful: 0.8
          praised: 0.8
          recognized: 0.8
          genius: 0.7
          impressive: 0.6
          acknowledged: 0.6
          clever: 0.5
          appreciated: 0.5
          skilled: 0.4
          competent: 0.3
          capable: 0.3

    # Source: Baumeister & Leary (1995) belongingness, Williams (2007)
    # ostracism, McClelland nPow, Winter (1973), Bandura (1977)
    social:
      - id: acceptance
        description: "Being welcomed, included, or embraced by a group or individual"
        vocabulary:
          embraced: 0.8
          welcomed: 0.8
          belonged: 0.8
          loved: 0.7
          accepted: 0.7
          included: 0.6
          approved: 0.5
          invited: 0.5
          valued: 0.5
          acknowledged: 0.4
          greeted: 0.3
          noticed: 0.2
      - id: exclusion
        description: "Being shut out, ostracized, or deliberately left out of a group"
        vocabulary:
          ostracized: 0.9
          shunned: 0.8
          banished: 0.8
          excluded: 0.7
          isolated: 0.6
          marginalized: 0.6
          left out: 0.5
          rejected: 0.5
          ignored: 0.4
          forgotten: 0.3
      - id: dominance
        description: "Having power or control over others — commanding, directing, overpowering"
        vocabulary:
          dominated: 0.9
          overpowered: 0.9
          humiliated: 0.8
          bullied: 0.8
          control: 0.7
          command: 0.7
          subordinated: 0.7
          authority: 0.5
          controlled: 0.5
          influence: 0.4
          pressure: 0.4
          direct: 0.3
      - id: submission
        description: "Yielding, surrendering, or deferring to another's will"
        vocabulary:
          submitted: 0.8
          surrendered: 0.8
          yielded: 0.6
          obeyed: 0.5
          complied: 0.5
          gave in: 0.4
          deferred: 0.4
      - id: modeling_observed
        description: "Watching someone else act and learning from their behavior"
        vocabulary:
          modeled: 0.8
          imitated: 0.8
          learned from: 0.7
          copied: 0.6
          observed: 0.5
          witnessed: 0.5
          watched: 0.3
          saw: 0.2

    # Source: evolutionary resource competition, Hobfoll (1989) COR theory
    resource:
      - id: scarcity
        description: "Not having enough — deprivation, hunger, lacking essential resources"
        vocabulary:
          deprived: 0.8
          poverty: 0.8
          hungry: 0.7
          starving: 0.8
          scarce: 0.6
          lacking: 0.5
          insufficient: 0.4
          without: 0.3
      - id: abundance
        description: "Having plenty — surplus, wealth, resources freely available"
        vocabulary:
          wealthy: 0.7
          surplus: 0.7
          abundant: 0.6
          plenty: 0.5
          provided: 0.4
          enough: 0.3
      - id: competition
        description: "Contesting with others for a prize, advantage, or scarce resource"
        vocabulary:
          competed: 0.8
          fought over: 0.8
          rivaled: 0.7
          rival: 0.7
          outwit: 0.6
          contested: 0.6
          competed for: 0.6
          defeat: 0.6
          scheme: 0.5
          race: 0.4
      - id: sharing
        description: "Giving or distributing resources cooperatively"
        vocabulary:
          generous: 0.7
          cooperative: 0.6
          shared: 0.5
          helped: 0.5
          distributed: 0.4
          gave: 0.3

    # Source: Deci & Ryan (2000) self-determination theory,
    # Seligman (1975) learned helplessness
    autonomy:
      - id: agency_granted
        description: "Having freedom to act independently — empowered, autonomous, self-directed"
        vocabulary:
          autonomy: 0.8
          empowered: 0.8
          freedom: 0.7
          independent: 0.6
          choice: 0.5
          allowed: 0.3
      - id: controlled
        description: "Being constrained, directed, or micromanaged with no choice"
        vocabulary:
          micromanaged: 0.8
          no choice: 0.8
          dictated: 0.7
          controlled: 0.5
          restricted: 0.5
          confined: 0.5
          constrained: 0.5
      - id: choice_available
        description: "Having options open — alternatives exist and decisions are possible"
        vocabulary:
          free to: 0.7
          options: 0.5
          alternatives: 0.5
          choose: 0.5
          decide: 0.4
          opportunity: 0.4
      - id: powerlessness
        description: "Feeling trapped, helpless, or unable to affect the outcome"
        vocabulary:
          powerless: 0.9
          helpless: 0.8
          trapped: 0.8
          no control: 0.7
          overwhelmed: 0.6
          stuck: 0.5
          paralyzed: 0.7

    # Source: Gray (1982) RST BAS/BIS, Skinner (1953) operant conditioning
    consequence:
      - id: reward
        description: "Positive outcome — a plan succeeding, a goal achieved, something desired obtained or won"
        vocabulary:
          triumph: 0.8
          rewarded: 0.8
          victory: 0.7
          prize: 0.7
          treasure: 0.6
          success: 0.5
          earned: 0.5
          praised: 0.5
          gained: 0.5
          win: 0.5
          bonus: 0.4
          received: 0.3
          found: 0.2
      - id: punishment
        description: "Negative consequence imposed — being disciplined, penalized, or scolded"
        vocabulary:
          punished: 0.9
          disciplined: 0.7
          penalized: 0.7
          scolded: 0.6
          reprimanded: 0.6
          consequences: 0.5
      - id: reward_removal
        description: "Something valued being taken away, confiscated, or withheld"
        vocabulary:
          taken away: 0.8
          deprived: 0.7
          withheld: 0.7
          confiscated: 0.7
          lost: 0.5
          removed: 0.5
      - id: aversive_removal
        description: "Relief from something negative — escaping, avoiding, or freed from a bad situation"
        vocabulary:
          relief: 0.8
          escaped: 0.7
          free from: 0.7
          avoided: 0.5
          stopped: 0.4
          ended: 0.3

    # Source: Reis et al. 2004 (PPR), Reeck et al. 2016 (SRC),
    # Rimé 2009, Williams 2007, Schilke et al. 2021
    social_context:
      - id: perceived_responsiveness
        description: "Felt understanding, validation, and caring from a present interaction partner"
        vocabulary:
          responsive: 0.8
          understanding: 0.7
          validating: 0.7
          caring: 0.7
          supportive: 0.6
          attentive: 0.5
          empathic: 0.5
      - id: target_distress
        description: "Observable distress in another agent — crying, trembling, visible anguish"
        vocabulary:
          distressed: 0.9
          crying: 0.8
          anguished: 0.8
          suffering: 0.7
          upset: 0.6
          distraught: 0.7
          troubled: 0.5
      - id: social_isolation
        description: "Absence of social contact — alone, no one nearby, ostracized"
        vocabulary:
          alone: 0.8
          isolated: 0.8
          nobody: 0.7
          solitary: 0.6
          empty: 0.4
          deserted: 0.5
      - id: power_asymmetry
        description: "Relational power advantage — authority, dominance, perceived impunity"
        vocabulary:
          authority: 0.7
          powerful: 0.7
          superior: 0.6
          dominant: 0.6
          advantage: 0.5
          impunity: 0.8
          untouchable: 0.7

  mediating:
    self_model:
      - name: self_worth
        type: bipolar
        range: [-1, 1]
        negative_pole: "worthless / helpless / incompetent"
        positive_pole: "worthy / competent / capable"
        source_models: [attachment, cbt, bandura]
      - name: self_efficacy
        type: bipolar
        range: [-1, 1]
        negative_pole: "incompetent / incapable"
        positive_pole: "capable / competent"
        source_models: [bandura, cbt]
    other_model:
      - name: other_reliability
        type: bipolar
        range: [-1, 1]
        negative_pole: "hostile / unreliable"
        positive_pole: "supportive / reliable"
        source_models: [attachment, cbt]
      - name: other_safety
        type: bipolar
        range: [-1, 1]
        negative_pole: "dangerous / judgmental"
        positive_pole: "safe / accepting"
        source_models: [attachment, cbt]
    world_model:
      - name: world_predictability
        type: bipolar
        range: [-1, 1]
        negative_pole: "dangerous / unfair"
        positive_pole: "safe / fair"
        source_models: [cbt]
      - name: future_outlook
        type: bipolar
        range: [-1, 1]
        negative_pole: "hopeless"
        positive_pole: "hopeful"
        source_models: [cbt]
    affect_systems:
      - name: BAS_activation
        type: unipolar
        range: [0, 1]
        source_models: [bis_bas, operant]
      - name: BIS_activation
        type: unipolar
        range: [0, 1]
        source_models: [bis_bas]
      - name: FFFS_activation
        type: unipolar
        range: [0, 1]
        source_models: [bis_bas, trauma]
      - name: arousal_level
        type: unipolar
        range: [0, 1]
        source_models: [bis_bas, trauma, attachment]
    threat_processing:
      - name: threat_sensitivity
        type: unipolar
        range: [0, 1]
        source_models: [trauma, bis_bas]
      - name: autonomic_activation
        type: unipolar
        range: [0, 1]
        source_models: [trauma]
      - name: escape_assessment
        type: unipolar
        range: [0, 1]
        source_models: [trauma, bis_bas]
    response_outcome:
      - name: reinforcement_expectation
        type: bipolar
        range: [-1, 1]
        negative_pole: "punishment expected"
        positive_pole: "reward expected"
        source_models: [operant, cbt, bandura]
      - name: punishment_expectation
        type: unipolar
        range: [0, 1]
        source_models: [operant]
    social_cognition:
      - name: model_attention
        type: unipolar
        range: [0, 1]
        source_models: [bandura]
      - name: behavior_schema
        type: unipolar
        range: [0, 1]
        source_models: [bandura]
      - name: behavior_attempt
        type: unipolar
        range: [0, 1]
        source_models: [bandura]
      - name: behavior_persistence
        type: unipolar
        range: [0, 1]
        source_models: [bandura]
      - name: vicarious_learning
        type: unipolar
        range: [0, 1]
        source_models: [bandura]
      - name: social_comparison
        type: unipolar
        range: [0, 1]
        source_models: [bandura]

  output:
    approach_avoidance:
      - approach
      - withdraw
      - cautious_approach
    social:
      - trust
      - distrust
      - proximity_seek
      - distance_maintain
    conflict:
      - fight
      - flight
      - freeze
      - fawn
      - assert
      - submit
    achievement:
      - persist
      - abandon
      - perfectionism
      - risk_take
    autonomy:
      - comply
      - rebel
      - self_direct
      - depend
    learning:
      - explore
      - consolidate
      # generalize and discriminate are intentionally predictor-only:
      # abstract learning operations not referenced by any CAPS consumer
      # (no resting activations, not in DriveCompetitionDetector).
      # Vocabulary labels for potential learning subsystem integration.
      # See casehubio/neocortex#1051.
      - generalize
      - discriminate
    regulation:
      - situation_selection
      - situation_modification
      - attentional_deployment
      - cognitive_change
      - response_modulation
      - social_support_seeking
      - social_sharing
      - social_withdrawal
      - co_regulation
      - deliberate_provocation
    # Coping nodes: 9 primary strategies have CAPS connections (below).
    # 7 secondary strategies (seek_information, suppress_information,
    # shift_responsibility, wishful_thinking, denial, procrastination,
    # resignation) are intentionally predictor-only: they are selected
    # by CopingGenerationPhase via CopingStrategy enum (Marsella &
    # Gratch 2009 EMA taxonomy), not activated through CAPS settling.
    # CAPS settles on the broad regulation family; the coping subsystem
    # refines within it.  See casehubio/neocortex#1051.
    coping:
      - seek_information
      - suppress_information
      - shift_responsibility
      - wishful_thinking
      - denial
      - mental_disengagement
      - positive_reinterpretation
      - coping_acceptance
      - planning
      - seek_instrumental_support
      - seek_emotional_support
      - active_confrontation
      - suppression
      - procrastination
      - resignation
      - avoidance

# Key connections with initial weights and provenance.
# Format: source -> target, weight, provenance (empirical/consensus/estimated)
# tags: connection group labels for disposition modulation resolution
connections:
  # Attachment chains
  - from: secure_attachment
    to: self_worth
    weight: 0.30
    provenance: empirical
    source: "van IJzendoorn 1995, r=.24-.32"
    tags: [social_input]
  - from: inconsistent_care
    to: other_reliability
    weight: -0.30
    provenance: empirical
    source: "van IJzendoorn 1995"
    tags: []
  - from: inconsistent_care
    to: proximity_seek
    weight: 0.40
    provenance: consensus
    source: "anxious attachment pattern"
    tags: []
  - from: rejection
    to: other_reliability
    weight: -0.35
    provenance: consensus
    source: "avoidant attachment formation"
    tags: []
  - from: rejection
    to: distance_maintain
    weight: 0.35
    provenance: consensus
    source: "avoidant attachment pattern"
    tags: []
  - from: self_worth
    to: trust
    weight: 0.40
    provenance: empirical
    source: "Zhang et al. 2022, r=.42 anxiety→mental health"
    tags: []
  - from: other_reliability
    to: trust
    weight: 0.45
    provenance: empirical
    source: "Zhang et al. 2022, r=.28 avoidance→mental health"
    tags: []
  - from: self_worth
    to: distrust
    weight: -0.40
    provenance: derived
    source: "inverse of self_worth→trust; low self-worth promotes distrust"
    tags: []
  - from: other_reliability
    to: distrust
    weight: -0.45
    provenance: derived
    source: "inverse of other_reliability→trust; low reliability promotes distrust"
    tags: []

  # Disposition-activated: social/achievement → self_worth
  - from: acceptance
    to: self_worth
    weight: 0.25
    provenance: consensus
    source: "social acceptance → self-worth (cooperative disposition boost)"
    tags: [social_input]
  - from: mastery
    to: self_worth
    weight: 0.25
    provenance: consensus
    source: "competence mastery → self-worth (independent disposition boost)"
    tags: []
  - from: performance_judged
    to: self_worth
    weight: 0.20
    provenance: consensus
    source: "performance evaluation → self-worth (competitive disposition boost)"
    tags: []
  - from: mastery
    to: self_efficacy
    weight: 0.30
    provenance: empirical
    source: "mastery experience → self-efficacy (Bandura 1997)"
    tags: []

  # BIS/BAS chains
  - from: reward
    to: BAS_activation
    weight: 0.50
    provenance: consensus
    source: "Gray RST dopaminergic RPE"
    tags: [bas]
  - from: punishment
    to: BIS_activation
    weight: 0.35
    provenance: consensus
    source: "punishment → behavioral inhibition (guilt, self-restraint)"
    tags: [bis]
  - from: punishment
    to: FFFS_activation
    weight: 0.50
    provenance: consensus
    source: "Gray RST aversive system"
    tags: [threat]
  - from: BAS_activation
    to: approach
    weight: 0.60
    provenance: empirical
    source: "Carver & White BAS scales"
    tags: [bas]
  - from: BIS_activation
    to: cautious_approach
    weight: 0.55
    provenance: empirical
    source: "BIS→anxiety g=1.21 meta-analysis"
    tags: [bis]
  - from: BIS_activation
    to: withdraw
    weight: 0.40
    provenance: empirical
    source: "BIS→depression g=0.99"
    tags: [bis]
  - from: FFFS_activation
    to: fight
    weight: 0.35
    provenance: consensus
    source: "defensive distance: proximate threat"
    tags: [threat, fight_assert]
  - from: FFFS_activation
    to: flight
    weight: 0.40
    provenance: consensus
    source: "defensive distance: intermediate"
    tags: [threat, flight_freeze_withdraw]
  - from: FFFS_activation
    to: freeze
    weight: 0.30
    provenance: consensus
    source: "defensive distance: distant/uncertain"
    tags: [threat, flight_freeze_withdraw]
  - from: escape_assessment
    to: flight
    weight: 0.35
    provenance: consensus
    source: "escapability modulates FFFS response"
    tags: [flight_freeze_withdraw]
  - from: escape_assessment
    to: freeze
    weight: -0.30
    provenance: consensus
    source: "inescapable → freeze over flight"
    tags: [flight_freeze_withdraw]

  # CBT chains
  - from: self_worth
    to: withdraw
    weight: -0.35
    provenance: empirical
    source: "CBT vs controls g=0.51"
    tags: []
  - from: future_outlook
    to: persist
    weight: 0.40
    provenance: consensus
    source: "hopelessness → behavioral withdrawal"
    tags: []
  - from: world_predictability
    to: threat_sensitivity
    weight: -0.30
    provenance: consensus
    source: "dangerous world → heightened threat detection"
    tags: [threat]

  # Trauma chains
  - from: physical_threat
    to: threat_sensitivity
    weight: 0.50
    provenance: empirical
    source: "ACE 4+ OR=4.6 depressed mood"
    tags: [threat]
  - from: physical_threat
    to: FFFS_activation
    weight: 0.55
    provenance: empirical
    source: "ACE 4+ OR=12.2 suicide attempt"
    tags: [threat]
  - from: threat_sensitivity
    to: arousal_level
    weight: 0.50
    provenance: consensus
    source: "kindling model: sensitization"
    tags: [threat]
  - from: powerlessness
    to: freeze
    weight: 0.40
    provenance: consensus
    source: "Walker 4F: inescapable threat"
    tags: [compliance, flight_freeze_withdraw]
  - from: powerlessness
    to: fawn
    weight: 0.35
    provenance: consensus
    source: "Walker 4F: threat from attachment figure"
    tags: [compliance, fawn_accommodate]

  # Operant chains (weight update — these define the learning signal)
  - from: reward
    to: reinforcement_expectation
    weight: 0.50
    provenance: empirical
    source: "Rescorla-Wagner, beta=0.1-0.5"
    tags: [bas]
  - from: punishment
    to: punishment_expectation
    weight: 0.50
    provenance: empirical
    source: "Rescorla-Wagner"
    tags: []
  - from: reinforcement_expectation
    to: approach
    weight: 0.45
    provenance: consensus
    source: "positive reinforcement → approach"
    tags: [bas]
  - from: punishment_expectation
    to: withdraw
    weight: 0.40
    provenance: consensus
    source: "punishment → avoidance"
    tags: []

  # Bandura chains
